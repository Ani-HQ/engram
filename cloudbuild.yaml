steps:
  # Gate the deploy on the suite. Cloud Build is what actually ships, so the tests
  # have to run here and not only in GitHub Actions: a trigger fires on the push
  # itself and would otherwise deploy a red main before Actions had finished.
  - name: 'oven/bun:1-debian'
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun install --frozen-lockfile
        bun test
        # The console is served from a public URL, so a remote script or font would
        # be both a privacy leak and a CSP failure.
        if grep -rnoE 'https?://[a-zA-Z0-9.-]+' web/ \
             --include='*.html' --include='*.css' --include='*.js' \
           | grep -vE 'localhost|127\.0\.0\.1|www\.w3\.org'; then
          echo "external reference found in web/" >&2
          exit 1
        fi

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/engram:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/engram']

  # Create placeholder TypeSafe/Voyage secrets when they are missing so the
  # first deploy after this change cannot die on --set-secrets. A value of
  # "unset" is treated as disabled by the gateway and fails open.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: secrets
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SA="engram-runtime@${PROJECT_ID}.iam.gserviceaccount.com"
        ensure_secret() {
          local name="$1"
          if ! gcloud secrets describe "$name" --project "$PROJECT_ID" >/dev/null 2>&1; then
            printf 'unset' | gcloud secrets create "$name" --project "$PROJECT_ID" --data-file=-
          fi
          gcloud secrets add-iam-policy-binding "$name" --project "$PROJECT_ID" \
            --member="serviceAccount:${SA}" --role="roles/secretmanager.secretAccessor" >/dev/null \
            || echo "secret accessor binding for ${name} already set or not grantable"
        }
        ensure_secret typesafe-api-key
        ensure_secret voyage-api-key

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-service
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'engram'
      - '--image=gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=engram-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:engram-pg'
      - '--set-secrets=ENGRAM_DB_URL_TEMPLATE=engram-db-url-template:latest,TYPESAFE_API_KEY=typesafe-api-key:latest,VOYAGE_API_KEY=voyage-api-key:latest'
      - '--set-env-vars=GBRAIN_HOMES_DIR=/tmp/gbrain-homes,ENGRAM_CLOUDSQL_INSTANCE=$PROJECT_ID:${_REGION}:engram-pg,REFLEX_MODEL=jev-latest,ENGRAM_EMBEDDING_MODEL=voyage:voyage-4-large,ENGRAM_EMBEDDING_DIMENSIONS=1024'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--timeout=900'
      - '--execution-environment=gen2'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-dream
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'engram-dream'
      - '--image=gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '--region=${_REGION}'
      - '--service-account=engram-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:engram-pg'
      - '--set-secrets=ENGRAM_DB_URL_TEMPLATE=engram-db-url-template:latest,TYPESAFE_API_KEY=typesafe-api-key:latest,VOYAGE_API_KEY=voyage-api-key:latest'
      - '--set-env-vars=GBRAIN_HOMES_DIR=/tmp/gbrain-homes,ENGRAM_CLOUDSQL_INSTANCE=$PROJECT_ID:${_REGION}:engram-pg,ENGRAM_JOB=dream,REFLEX_MODEL=jev-latest,ENGRAM_EMBEDDING_MODEL=voyage:voyage-4-large,ENGRAM_EMBEDDING_DIMENSIONS=1024'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--task-timeout=900s'
      - '--max-retries=1'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: schedule-dream
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        export ENGRAM_PROJECT="$PROJECT_ID"
        deploy/setup-scheduler.sh || echo "scheduler setup skipped (re-run deploy/setup-scheduler.sh)"

# A build that names its own service account must say where logs go, or it is
# rejected before the first step runs. `gcloud builds submit` never hit this,
# because it uses the default Cloud Build account and inherits its bucket; the
# trigger names the account explicitly and so must choose.
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/engram:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/engram:latest'
