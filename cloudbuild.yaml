steps:
  # Gate the deploy on the suite. Cloud Build is what actually ships, so the tests
  # have to run here and not only in GitHub Actions: a trigger fires on the push
  # itself and would otherwise deploy a red main before Actions had finished.
  - name: 'oven/bun:1-debian'
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun install --frozen-lockfile
        bun test
        # The console is served from a public URL, so a remote script or font would
        # be both a privacy leak and a CSP failure.
        if grep -rnoE 'https?://[a-zA-Z0-9.-]+' web/ \
             --include='*.html' --include='*.css' --include='*.js' \
           | grep -vE 'localhost|127\.0\.0\.1|www\.w3\.org'; then
          echo "external reference found in web/" >&2
          exit 1
        fi

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/engram:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/engram']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'engram'
      - '--image=gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=engram-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:engram-pg'
      - '--set-secrets=ENGRAM_DB_URL_TEMPLATE=engram-db-url-template:latest'
      - '--set-env-vars=GBRAIN_HOMES_DIR=/tmp/gbrain-homes,ENGRAM_CLOUDSQL_INSTANCE=$PROJECT_ID:${_REGION}:engram-pg'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--timeout=900'
      - '--execution-environment=gen2'

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/engram:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/engram:latest'
