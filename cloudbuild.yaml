steps:
  # Gate the deploy on the suite. Cloud Build is what actually ships, so the tests
  # have to run here and not only in GitHub Actions: a trigger fires on the push
  # itself and would otherwise deploy a red main before Actions had finished.
  - name: 'oven/bun:1-debian'
    id: test
    env:
      - 'ENGRAM_DB_URL_TEMPLATE=postgresql://postgres:postgres@127.0.0.1:1/__DB__'
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bun --version
        bun install --frozen-lockfile
        bun test
        # The console is served from a public URL, so a remote script or font would
        # be both a privacy leak and a CSP failure.
        if grep -rnoE 'https?://[a-zA-Z0-9.-]+' web/ \
             --include='*.html' --include='*.css' --include='*.js' \
           | grep -vE 'localhost|127\.0\.0\.1|www\.w3\.org'; then
          echo "external reference found in web/" >&2
          exit 1
        fi

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/engram:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/engram']

  # Same service flags as the last successful deploy (console-v2). Extra
  # provider secrets are not mounted here; the gateway treats missing keys
  # as disabled. The dream job is best-effort so it cannot roll back main.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-service
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'engram'
      - '--image=gcr.io/$PROJECT_ID/engram:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=engram-runtime@$PROJECT_ID.iam.gserviceaccount.com'
      - '--add-cloudsql-instances=$PROJECT_ID:${_REGION}:engram-pg'
      - '--set-secrets=ENGRAM_DB_URL_TEMPLATE=engram-db-url-template:latest,TYPESAFE_API_KEY=typesafe-api-key:latest'
      - '--set-env-vars=GBRAIN_HOMES_DIR=/tmp/gbrain-homes,ENGRAM_CLOUDSQL_INSTANCE=$PROJECT_ID:${_REGION}:engram-pg,REFLEX_MODEL=jev-latest'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--memory=2Gi'
      - '--cpu=1'
      - '--timeout=900'
      - '--execution-environment=gen2'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-dream
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy engram-dream \
          --image=gcr.io/$PROJECT_ID/engram:$BUILD_ID \
          --region=${_REGION} \
          --service-account=engram-runtime@$PROJECT_ID.iam.gserviceaccount.com \
          --set-cloudsql-instances=$PROJECT_ID:${_REGION}:engram-pg \
          --set-secrets=ENGRAM_DB_URL_TEMPLATE=engram-db-url-template:latest,TYPESAFE_API_KEY=typesafe-api-key:latest \
          --set-env-vars=GBRAIN_HOMES_DIR=/tmp/gbrain-homes,ENGRAM_CLOUDSQL_INSTANCE=$PROJECT_ID:${_REGION}:engram-pg,ENGRAM_JOB=dream,REFLEX_MODEL=jev-latest \
          --memory=2Gi \
          --cpu=1 \
          --task-timeout=900s \
          --max-retries=1 \
          || echo "dream job skipped"
        ENGRAM_PROJECT=$PROJECT_ID ENGRAM_REGION=${_REGION} deploy/setup-scheduler.sh \
          || echo "scheduler setup skipped"

# A build that names its own service account must say where logs go, or it is
# rejected before the first step runs. `gcloud builds submit` never hit this,
# because it uses the default Cloud Build account and inherits its bucket; the
# trigger names the account explicitly and so must choose.
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/engram:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/engram:latest'
