# Self-host path: `docker compose up` gives you the whole brain on any box.
# Also the restore-drill target: load a pg_dump into `db`, point a client at :8080.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram}
    volumes:
      - engram-pg:/var/lib/postgresql/data
      - ./deploy/create-dbs.sql:/docker-entrypoint-initdb.d/create-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  engram:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENGRAM_DB_URL_TEMPLATE: postgresql://postgres:${POSTGRES_PASSWORD:-engram}@db:5432/__DB__
      ENGRAM_SCOPES: ${ENGRAM_SCOPES:-shared}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - engram-homes:/gbrain-homes

volumes:
  engram-pg:
  engram-homes:
